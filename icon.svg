<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" fill="#FFFFFF"/>
  <!-- Mudita stock-tile frame: rect 496x496 rx112, stroke 16. -->
  <rect x="8" y="8" width="496" height="496" rx="112" fill="none" stroke="#000000" stroke-width="16"/>
  <!-- C3: top tread lands flat at the peak (last segment is
       horizontal into 256,140). Three near-square steps
       (37-38 units). Tail tips level and equidistant from
       centre: left (144,252), right (368,252), 112 each side. -->
  <g fill="none" stroke="#000000" stroke-width="16" stroke-linejoin="miter" stroke-linecap="round">
    <path d="M 144 252 L 144 215 L 181 215 L 181 177 L 219 177 L 219 140 L 256 140 L 368 252"/>
    <line x1="256" y1="290" x2="256" y2="362"/>
    <line x1="220" y1="326" x2="292" y2="326"/>
  </g>
</svg>
