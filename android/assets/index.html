<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="light" />
<meta name="theme-color" content="#ffffff" />
<link rel="icon" href="data:," />
<title>Construction Calculator</title>
<style>
  :root{
    /* MMD v1.3: no grey TEXT — all text is --ink (near-black). Light fills
       (--num-bg/--op-bg) and hairline dividers (--line/--key-line) are kept
       as background/border only, never as text; a black alternative would
       make keys indistinguishable and dividers too heavy on E Ink. */
    --page:#e8e8e6; --bg:#ffffff; --ink:#141412;
    --line:#e2e2de; --key-line:#d9d9d4; --num-bg:#f3f3f1; --op-bg:#eaeae7;
    --solid:#141412; --on-solid:#ffffff; --focus:#141412;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{margin:0; background:var(--page); overflow:hidden; color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    display:flex; align-items:stretch; justify-content:center;}
  /* ---------- app sheet: flat, paper-white, no device shell ---------- */
  .device{background:var(--bg); border-left:1px solid var(--line); border-right:1px solid var(--line);
    width:min(440px,100vw); height:min(100dvh,940px); max-height:100dvh;
    padding:26px 20px 18px; display:flex; flex-direction:column; gap:12px;}
  @media (max-width:480px){ .device{border:none; height:100dvh; padding:22px 16px 14px;} }
  /* ---------- top bar: ONE header row, shared by calculator and History ----------
     Same height, same left slot, same centre slot, same right slot on both
     screens (MMD "Fit in the Lines": common elements stay in the same pixels,
     only textual details change). */
  .topbar{display:flex; justify-content:space-between; align-items:center; gap:8px; min-height:44px; flex:0 0 auto;}
  .top-title{font-size:.78rem; letter-spacing:.16em; font-weight:500; color:var(--ink);
    text-transform:uppercase; text-align:center; flex:1 1 auto; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .hist-count{font-size:.78rem; font-weight:500; color:var(--ink); white-space:nowrap;
    min-height:44px; display:flex; align-items:center;}
  /* ---------- display: open paper, hairline rule underneath ---------- */
  .lcd{color:var(--ink); padding:10px 2px 16px; border-bottom:1px solid var(--ink); flex:0 0 auto;}
  .hist-btn{font:inherit; font-size:.7rem; letter-spacing:.14em; font-weight:600;
    border:1px solid var(--ink); border-radius:999px; background:var(--bg); color:var(--ink);
    padding:8px 14px; min-height:44px; cursor:pointer; flex:0 0 auto;}
  .hist-btn:active{background:var(--solid); color:var(--on-solid);}
  .lcd-inds{display:flex; gap:6px; margin-left:auto;}
  /* ---------- history screen: MMD paged list, fixed rows, no scrolling ----------
     8 fixed-height rows per page; dividers in exactly the same pixels on
     every page; discrete ▲/▼ paging with a visible page indicator. */
  /* History is a sheet over the keypad area only: the display and the
     top bar stay visible above it. Own scroll so the pager is always
     reachable on a short screen; paging (8/page) is still the primary
     navigation. */
  .calc-body{position:relative; flex:1 1 auto; min-height:0; display:flex; flex-direction:column; gap:12px;}
  .history{display:none; position:absolute; inset:0; z-index:5; background:var(--bg);
    flex-direction:column; gap:10px;}
  .device.show-history .history{display:flex;}
  .hist-head{flex:0 0 44px; min-height:44px; display:flex; align-items:center; justify-content:space-between;
    border-bottom:1px solid var(--ink); padding:0 2px;}
  .hist-head-title{font-size:.78rem; letter-spacing:.16em; font-weight:500; text-transform:uppercase;}
  .hist-head-count{font-size:.78rem; font-weight:500;}
  .hist-list{flex:1 1 auto; min-height:0; overflow:auto; display:flex; flex-direction:column;}
  .hist-row{display:flex; flex-direction:column; align-items:flex-start; justify-content:center; gap:2px; width:100%;
    height:64px; flex:0 0 64px; box-sizing:border-box;
    text-align:left; background:var(--bg); border:none; border-bottom:1px solid var(--line);
    padding:8px 4px; cursor:pointer; font:inherit; color:var(--ink);}
  .hist-row:active{background:var(--num-bg);}
  .hist-expr{font-size:.8rem; color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%;}
  .hist-res{font-size:1.25rem; font-weight:300; font-variant-numeric:tabular-nums;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%;}
  .hist-empty{color:var(--ink); padding:28px 4px; text-align:center; font-size:.9rem;}
  .hist-pager{display:flex; justify-content:space-between; align-items:center; gap:8px; flex:0 0 auto; min-height:56px;}
  .hist-page-btn{font:inherit; font-size:.9rem; font-weight:500;
    border:1px solid var(--ink); border-radius:999px; background:var(--bg); color:var(--ink);
    padding:8px 18px; min-height:44px; cursor:pointer; flex:0 0 auto;}
  .hist-page-btn:active{background:var(--solid); color:var(--on-solid);}
  .hist-page-btn[hidden]{visibility:hidden;}
  .hist-page-info{font-size:.78rem; font-weight:500; color:var(--ink); white-space:nowrap;}
  .ind{font-size:.6rem; letter-spacing:.12em; font-weight:600; border:1px solid var(--ink);
    border-radius:999px; padding:1px 8px; line-height:1.5; display:none;}
  .ind.on{display:block;}
  .lcd-main{display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin-top:8px;}
  .lcd-label{font-size:.78rem; letter-spacing:.16em; font-weight:500; color:var(--ink);
    text-transform:uppercase; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .lcd-value{font-weight:300; letter-spacing:-.01em; font-variant-numeric:tabular-nums;
    font-size:clamp(2.3rem,10vmin,3.4rem); line-height:1.05; text-align:right; white-space:nowrap;}
  .lcd-units{display:flex; justify-content:space-between; align-items:baseline; margin-top:8px; gap:10px;}
  /* v1.5: sub line holds only the "N of N" solver indicator; empty it
     collapses away entirely so the display is just the value. */
  .lcd-sub{color:var(--ink); font-size:clamp(.72rem,3vmin,.84rem); white-space:nowrap;
    overflow:hidden; text-overflow:ellipsis; font-variant-numeric:tabular-nums;}
  .lcd-sub:empty{display:none;}
  .lcd-unitcap{font-size:.62rem; letter-spacing:.18em; font-weight:600; color:var(--ink); white-space:nowrap;}
  /* ---------- Clear: v1.5, top-right corner of the face (top bar) ----------
     It no longer has a row of its own — the space goes back to the
     keypad rows, which grow taller. Same key, same behaviour. */
  .topbar .key{flex:0 0 auto; min-width:64px;}
  /* ---------- keypad: stock-calculator air (v1.5 inspo) ----------
     Number and function keys are plain black text — no fill, no
     border. Operator keys (÷ × − +) sit in thin outlined rounded
     squares. = stays a solid black rounded square with white =.
     Conv stays solid black. Clear (top bar) is plain text too. */
  .keypad{flex:1 1 auto; min-height:0; display:grid; grid-template-rows:repeat(8,1fr); gap:12px;}
  .krow{display:grid; grid-template-columns:repeat(5,1fr); gap:12px; min-height:0;}
  .cell{display:flex; min-height:0;}
  /* v1.4: no small-print second-function labels anywhere on the face.
     Keys with a second function carry a small dot (top-right corner);
     pressing Conv swaps their visible label to the second function. */
  button.key{position:relative; font:inherit; flex:1 1 auto; min-height:0; border:none; border-radius:14px;
    background:transparent; color:var(--ink); cursor:pointer; padding:1px 2px;
    font-size:clamp(1rem,4.5vmin,1.2rem); font-weight:500; line-height:1.05;}
  button.key.has-shift::after{content:"\2022"; position:absolute; top:3px; right:6px;
    font-size:.6rem; line-height:1; color:var(--ink);}
  button.key.num{background:transparent; border:none;
    font-size:clamp(1.3rem,6vmin,1.8rem); font-weight:400;}
  button.key[data-k^="op:"]{background:transparent; border:1.5px solid var(--ink); border-radius:12px;}
  button.key.conv{background:var(--solid); color:var(--on-solid); border-color:transparent; font-weight:600;}
  button.key.conv.armed{background:var(--bg); color:var(--ink); border:1.5px solid var(--ink);}
  button.key[data-k="eq"]{background:var(--solid); color:var(--on-solid); border-color:transparent; font-weight:600;}
  button.key:active{background:var(--solid); color:var(--on-solid); border-color:transparent;}
  button.key.conv:active, button.key[data-k="eq"]:active{background:var(--bg); color:var(--ink); border-color:var(--ink);}
  button.key:focus-visible{outline:2px solid var(--focus); outline-offset:2px;}
  button.key.power-key{border:none; border-radius:14px; background:transparent;
    font-size:clamp(.9rem,4vmin,1.1rem); font-weight:500; letter-spacing:0; min-height:44px;}
  .sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0);}
</style>
</head>
<body>
<div class="device" role="application" aria-label="Construction calculator">
  <!-- ================= SHARED TOP BAR (calculator + History, same pixels) ================= -->
  <div class="topbar" id="topbar">
    <button class="hist-btn" id="histBtn" type="button" aria-label="History">&#9719; HIST</button>
    <button class="hist-btn" id="histBack" type="button" style="display:none">&larr; Calc</button>
    <span class="top-title" id="topTitle"></span>
    <span class="lcd-inds" id="lcdInds">
      <span class="ind" id="indShift">SHIFT</span>
      <span class="ind" id="indRcl">RCL</span>
      <span class="ind" id="indMem">MEM</span>
    </span>
    <span class="hist-count" id="histCount" style="display:none"></span>
    <button class="key power-key" id="clearBtn" data-k="onc" type="button">Clear</button>
  </div>
  <!-- ================= DISPLAY ================= -->
  <div class="lcd" id="lcd">
    <div class="lcd-main">
      <span class="lcd-label" id="dispLabel">Ready</span>
      <span class="lcd-value" id="dispMain">0&Prime;</span>
    </div>
    <div class="lcd-units">
      <span class="lcd-sub" id="dispSub"></span>
      <span class="lcd-unitcap" id="dispUnits">FEET&nbsp;&nbsp;·&nbsp;&nbsp;INCH</span>
    </div>
  </div>

  <div class="calc-body">

  <!-- ================= KEYPAD ================= -->
  <div class="keypad" aria-label="Keypad">
    <div class="krow">
      <div class="cell"><button class="key" data-k="pitch" type="button">Pitch</button></div>
      <div class="cell"><button class="key" data-k="rise" type="button">Rise</button></div>
      <div class="cell"><button class="key" data-k="run" type="button">Run</button></div>
      <div class="cell"><button class="key" data-k="diag" type="button">Diag</button></div>
      <div class="cell"><button class="key" data-k="hip" type="button">Hip/V</button></div>
    </div>
    <div class="krow">
      <div class="cell"><button class="key" data-k="bdft" type="button">Bd Ft</button></div>
      <div class="cell"><button class="key" data-k="stair" type="button">Stair</button></div>
      <div class="cell"><button class="key" data-k="circ" type="button">Circ</button></div>
      <div class="cell"><button class="key" data-k="rwall" type="button">R/Wall</button></div>
      <div class="cell"><button class="key" data-k="jack" type="button">Jack</button></div>
    </div>
    <div class="krow">
      <div class="cell"><button class="key" data-k="m" type="button">m</button></div>
      <div class="cell"><button class="key" data-k="cm" type="button">cm</button></div>
      <div class="cell"><button class="key" data-k="mm" type="button">mm</button></div>
      <div class="cell"><button class="key" data-k="weight" type="button">Weight</button></div>
      <div class="cell"><button class="key" data-k="sqrt" type="button">&radic;x</button></div>
    </div>
    <div class="krow">
      <div class="cell"><button class="key" data-k="yds" type="button">Yds</button></div>
      <div class="cell"><button class="key" data-k="feet" type="button">Feet</button></div>
      <div class="cell"><button class="key" data-k="inch" type="button">Inch</button></div>
      <div class="cell"><button class="key" data-k="frac" type="button">/</button></div>
      <div class="cell"><button class="key" data-k="back" type="button" aria-label="Backspace">&#9003;</button></div>
    </div>
    <div class="krow">
      <div class="cell"><button class="key conv" data-k="conv" type="button">Conv</button></div>
      <div class="cell"><button class="key num" data-k="d:7" type="button">7</button></div>
      <div class="cell"><button class="key num" data-k="d:8" type="button">8</button></div>
      <div class="cell"><button class="key num" data-k="d:9" type="button">9</button></div>
      <div class="cell"><button class="key" data-k="op:/" type="button">&divide;</button></div>
    </div>
    <div class="krow">
      <div class="cell"><button class="key" data-k="rcl" type="button">Rcl</button></div>
      <div class="cell"><button class="key num" data-k="d:4" type="button">4</button></div>
      <div class="cell"><button class="key num" data-k="d:5" type="button">5</button></div>
      <div class="cell"><button class="key num" data-k="d:6" type="button">6</button></div>
      <div class="cell"><button class="key" data-k="op:*" type="button">&times;</button></div>
    </div>
    <div class="krow">
      <div class="cell"><button class="key" data-k="mplus" type="button">M+</button></div>
      <div class="cell"><button class="key num" data-k="d:1" type="button">1</button></div>
      <div class="cell"><button class="key num" data-k="d:2" type="button">2</button></div>
      <div class="cell"><button class="key num" data-k="d:3" type="button">3</button></div>
      <div class="cell"><button class="key" data-k="op:-" type="button">&minus;</button></div>
    </div>
    <div class="krow">
      <div class="cell"><button class="key" data-k="pct" type="button">%</button></div>
      <div class="cell"><button class="key num" data-k="d:0" type="button">0</button></div>
      <div class="cell"><button class="key num" data-k="dot" type="button">&middot;</button></div>
      <div class="cell"><button class="key" data-k="eq" type="button">=</button></div>
      <div class="cell"><button class="key" data-k="op:+" type="button">+</button></div>
    </div>
  </div>

  <!-- ================= HISTORY (replaces Tape): sheet over the keypad ================= -->
  <div class="history" id="historyView" aria-label="History">
    <div class="hist-head"><span class="hist-head-title">History</span><span class="hist-head-count" id="histHeadCount"></span></div>
    <div class="hist-list" id="historyList"></div>
    <div class="hist-empty" id="historyEmpty">No calculations yet</div>
    <div class="hist-pager">
      <button class="hist-page-btn" id="histPrev" type="button">&uarr; Prev</button>
      <span class="hist-page-info" id="histPageInfo"></span>
      <button class="hist-page-btn" id="histNext" type="button">Next &darr;</button>
    </div>
  </div>
  </div>

</div>

<script>
"use strict";
/* =====================================================================
   ConCalc v1.5 — key rules implemented here (MMD-aligned):
   - History: overlay sheet over the keypad area (display and top bar
     stay visible), newest first, fixed-height rows, discrete paged
     scrolling (8 per page, ▲/▼ arrows + page indicator), fixed 44px
     header inside the sheet, own scroll if the sheet is short. No wipe
     control — history auto-prunes to the last 100 entries, oldest drops
     automatically. Persisted in localStorage (concalc.history.v1).
   - Numbers are PLAIN until tagged: type a number, then Feet/Inch/Yds/
     m/cm/mm tags it; an untagged number is a plain count (reference:
     "enter dimensions from largest to smallest", and % / board-feet /
     plain-math examples use untagged numbers).
   - Feet/Inch tag a typed number (9 + Inch = 9", 6 + Feet = 6'); a
     decimal typed number + Feet/Inch = decimal feet/inches.
   - Repeat presses cycle ONLY where the reference says so: Pitch
     (in -> deg -> %grade -> slope), Circle (DIA -> AREA -> CIRC),
     Weight (Ton -> LB -> MET Ton -> kG), Stair (12 results),
     Jack / Rake-Wall (next stud), Prefs (% steps settings, + steps
     options), Feet/Inch during conversions (fractional <-> decimal).
     Everything else is idempotent: Diag always gives Diag, etc.
   - Conv (Ç) is the reference Convert prefix: Ç + unit converts the
     displayed value; Ç + another key is that key's second function.
   - Conv swaps key labels (see SHIFT_LABELS): no small-print
     second-function labels on the face at all — a dot marks keys
     that have a second function. Label swap is display-only.
   - Clear sits in the top-right corner of the face (top bar) and has
     no row of its own; the freed space goes to the keypad rows.
     1st press clears the display, 2nd clears temporary values.
   - The display shows the value only: no explanatory subtext under
     it (no unit conversions, no pitch explanation, no
     instructions). The sub line carries only the solver position
     ("1 of N") when stepping through multi-result solvers.
   - Styling follows the stock calculator inspo: airy rows, plain-text
     keys with no fill or border, operators in thin outlined rounded
     squares, = solid black. Conflicts resolved for the approved
     v1.5 list: 5 columns stay (inspo has 4), Clear stays top-right
     (inspo has AC top-left).
   ===================================================================== */
function $(id){return document.getElementById(id);}
function gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){var t=a%b;a=b;b=t;}return a||1;}
function fmtNum(x,d){ if(!isFinite(x)) return "—"; var s=Number(x).toFixed(d===undefined?2:d); if(s.indexOf(".")>=0){ s = s.replace(/0+$/,"").replace(/\.$/,""); } return s === "" || s === "-" ? "0" : s; }
function fmtInt(x){ return Math.round(x).toLocaleString("en-US"); }
function money(x){ return "$" + Number(x).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g,","); }
function roundRes(x, res){ return Math.round(x*res)/res; }

/* ---------- preferences (reference: Prefs = Conv + %, see prefs mode) ---------- */
var prefRes = 16, prefWaste = 10;              /* waste: internal default only */
var prefArea = "std", prefVol = "std";         /* std | sqft | sqyd | sqm / std | cuyd | cuft | cum */
var prefMeter = "0.000", prefDeg = "0.00", prefFracMode = "std";
var tempRes = null;                            /* Conv+1/2/3/4/6/8, temporary */
function res(){ return tempRes || prefRes; }

function fmtFI(totalIn, r){
  if(!isFinite(totalIn)) return "—";
  r = r || res();
  var sign = totalIn < 0 ? "−" : "";
  var rounded = Math.round(Math.abs(totalIn) * r) / r;
  var feet = Math.floor(rounded / 12);
  var rem = rounded - feet*12;
  var wholeIn = Math.floor(rem + 1e-9);
  var fracVal = rem - wholeIn;
  var num = Math.round(fracVal * r), den = r;
  if(num === r){ wholeIn += 1; num = 0; }
  if(wholeIn === 12){ feet += 1; wholeIn = 0; }
  var out = sign;
  if(feet) out += feet + "′";
  var parts = "";
  if(wholeIn || (!feet && !num)) parts = String(wholeIn);
  if(num){
    var g = gcd(num, den); num/=g; den/=g;
    parts = (parts && parts!=="0") ? parts + " " + num + "/" + den : (wholeIn===0 && feet ? "0 " + num + "/" + den : num + "/" + den);
    if(wholeIn===0 && !feet) parts = num + "/" + den;
  }
  if(!parts) parts = "0";
  out += (feet ? " " : "") + parts + "″";
  return out.trim();
}
function fmtFracInch(totalIn){
  if(!isFinite(totalIn)) return "—";
  var r = res();
  var sign = totalIn < 0 ? "−" : "";
  var rounded = Math.round(Math.abs(totalIn) * r) / r;
  var whole = Math.floor(rounded + 1e-9);
  var num = Math.round((rounded - whole) * r), den = r;
  if(num === r){ whole += 1; num = 0; }
  if(num){ var g = gcd(num, den); num/=g; den/=g; return sign + (whole ? whole + "-" + num + "/" + den : num + "/" + den) + " INCH"; }
  return sign + whole + " INCH";
}
var dispMode = "ftin";   /* ftin | decft | decin | fracin | yd | m | cm | mm */
function fmtByPref(val, dim){
  if(dim===2){
    if(prefArea==="sqyd") return fmtNum(val/1296,4) + " yd²";
    if(prefArea==="sqm") return fmtNum(val/929.0304,4) + " m²";
    return fmtNum(val/144,4) + " ft²";
  }
  if(dim===3){
    if(prefVol==="cuft") return fmtNum(val/1728,2) + " ft³";
    if(prefVol==="cum") return fmtNum(val*0.0000163871,4) + " m³";
    return fmtNum(val/46656,6) + " yd³";
  }
  if(dim===0) return fmtNum(val,4);
  if(dispMode==="decft") return fmtNum(val/12,4) + " ft";
  if(dispMode==="decin") return fmtNum(val,3) + " in";
  if(dispMode==="fracin") return fmtFracInch(val);
  if(dispMode==="yd") return fmtNum(val/36,4) + " yd";
  if(dispMode==="m" || dispMode==="cm" || dispMode==="mm"){
    var mm = val*25.4;
    if(prefMeter==="float") return fmtNum(mm/1000,6) + " m";
    if(Math.abs(mm) >= 1000) return fmtNum(mm/1000,3) + " m";
    if(Math.abs(mm) >= 10) return fmtNum(mm/10,3) + " cm";
    return fmtNum(mm,2) + " mm";
  }
  return fmtFI(val);
}
function fmtAngle(deg){
  if(prefDeg==="float") return fmtNum(deg,5) + "°";
  return fmtNum(deg,2) + "°";
}

/* ---------- history: paged list, newest first, persisted (MMD) ----------
   Fixed-height rows, 8 per page, discrete ▲/▼ paging. No wipe control:
   history auto-prunes to the last 100 entries, oldest drops automatically. */
var histEntries = [], historyOpen = false, histPage = 0;
var HIST_KEY = "concalc.history.v1", HIST_MAX = 100, HIST_PER_PAGE = 8;
function loadHistory(){
  try{
    var raw = localStorage.getItem(HIST_KEY);
    if(raw){ var arr = JSON.parse(raw); if(Array.isArray(arr)) histEntries = arr.slice(0, HIST_MAX); }
  }catch(e){ histEntries = []; }
}
function saveHistory(){
  try{ localStorage.setItem(HIST_KEY, JSON.stringify(histEntries)); }catch(e){}
}
function addHistory(expr, resultText, val, dim){
  if(histEntries.length && histEntries[0].expr === expr && histEntries[0].result === resultText) return;
  histEntries.unshift({expr:expr, result:resultText, val:val, dim:dim});
  if(histEntries.length > HIST_MAX) histEntries.length = HIST_MAX;
  saveHistory();
  if(historyOpen){ histPage = 0; renderHistory(); }
}
function histPageCount(){ return Math.max(1, Math.ceil(histEntries.length / HIST_PER_PAGE)); }
function renderHistory(){
  var list = $("historyList"); if(!list) return;
  list.innerHTML = "";
  var total = histEntries.length;
  if(histPage > histPageCount() - 1) histPage = histPageCount() - 1;
  if(histPage < 0) histPage = 0;
  $("historyEmpty").style.display = total ? "none" : "";
  var start = histPage * HIST_PER_PAGE;

/* ---------- entry builder ----------
   Numbers start PLAIN (bMode "num"). A unit key tags the typed number:
   Feet/Inch -> ft-in fields (decimal number -> decimal ft/in),
   Yds/m/cm/mm -> that unit. Pressing the same unit again raises the
   dimension (5 y y y = 5 cu yd; 130 f f = 130 sq ft). */
var bMode = "num", single = "", bDim = 1, bDimUnit = 12;
var fields = {feet:"", inch:"", num:"", den:""};
var activeField = "feet";
var UNIT_TO_IN = {decin:1, decft:12, yd:36, m:39.3700787402, cm:0.3937007874, mm:0.03937007874, num:1};
var UNIT_LBL = {decin:"in", decft:"ft", yd:"yd", m:"m", cm:"cm", mm:"mm", num:"№"};

function builderHasInput(){
  if(bMode === "num") return single !== "";
  if(bMode === "ftin") return fields.feet!=="" || fields.inch!=="" || fields.num!=="" || fields.den!=="";
  return single !== "";
}
function builderValue(){
  if(bMode === "num"){
    var n = parseFloat(single);
    return {val: isNaN(n) ? 0 : n, dim:0};
  }
  if(bMode === "ftin"){
    var f = parseFloat(fields.feet)||0, i = parseFloat(fields.inch)||0;
    var nn = parseFloat(fields.num)||0, dd = parseFloat(fields.den)||0;
    var frac = 0;
    if(nn && dd) frac = nn/dd;
    else if(nn && !dd) frac = nn / res();   /* reference: no denominator -> resolution setting */
    var neg = (String(fields.feet).indexOf("-")===0);
    var lin = Math.abs(f)*12 + Math.abs(i) + frac;
    var val = (bDim === 1) ? lin : lin * Math.pow(bDimUnit, bDim-1);
    return {val: neg ? -val : val, dim:bDim};
  }
  var v2 = parseFloat(single);
  if(isNaN(v2)) return null;
  var fac = UNIT_TO_IN[bMode] || 1;
  return {val: v2 * Math.pow(fac, bDim), dim:bDim};
}
function clearBuilder(){
  bMode = "num"; single = ""; bDim = 1; bDimUnit = 12;
  fields = {feet:"", inch:"", num:"", den:""}; activeField = "feet";
}
function rawParts(){
  if(bMode === "num") return single;
  if(bMode === "ftin"){
    var p = [];
    if(fields.feet!=="") p.push(fields.feet + " ft");
    if(fields.inch!=="") p.push(fields.inch + " in");
    if(fields.num!=="" || fields.den!=="") p.push((fields.num||"?") + "/" + (fields.den||"?"));
    if(bDim === 2) p.push("sq");
    if(bDim === 3) p.push("cu");
    return p.join(" · ");
  }
  return single + " " + (UNIT_LBL[bMode]||"") + (bDim===2 ? "²" : bDim===3 ? "³" : "");
}
function bareNumber(){
  if(bMode === "num"){ var s = parseFloat(single); return isNaN(s) ? null : s; }
  if(bMode === "ftin"){
    if(fields.feet!=="" && fields.inch==="" && fields.num==="" && fields.den==="") return parseFloat(fields.feet);
    if(fields.inch!=="" && fields.feet==="" && fields.num==="" && fields.den==="") return parseFloat(fields.inch);
    return null;
  }
  var s2 = parseFloat(single); return isNaN(s2) ? null : s2;
}

/* ---------- arithmetic ---------- */
function applyOp(a, op, b){
  if(op==="+") return {val:a.val + convDim(b,a.dim), dim:a.dim};
  if(op==="-") return {val:a.val - convDim(b,a.dim), dim:a.dim};
  if(op==="*") return {val:a.val * b.val, dim:Math.min(3, a.dim + b.dim)};
  if(op==="/") return {val: b.val===0 ? NaN : a.val / b.val, dim:Math.max(0, a.dim - b.dim)};
  return b;
}
function convDim(b, targetDim){
  if(b.dim === targetDim) return b.val;
  return b.val;   /* plain numbers (dim 0) are used as-is */
}
function opSymbol(op){ return {"+":"+","-":"−","*":"×","/":"÷"}[op] || op; }
function commitEntry(){

  var v = builderValue(); clearBuilder(); return v;
}
function pressOp(op){

    if(pendingOp){ acc = applyOp(acc, pendingOp, entry); }
    else acc = entry;
  }
  pendingOp = op; lastPct = null; costPerMbm = false;
  justEvaluated = false;
  setDisplay(acc.val, acc.dim, fmtByPref(acc.val, acc.dim) + " " + opSymbol(op));
}
function pressEquals(){
  var entry = commitEntry();
  if(acc !== null && pendingOp && entry){
    var expr = fmtByPref(acc.val, acc.dim) + " " + opSymbol(pendingOp) + " " + fmtByPref(entry.val, entry.dim);
    var res = applyOp(acc, pendingOp, entry);
    addHistory(expr, fmtByPref(res.val, res.dim), res.val, res.dim);
    acc = null; pendingOp = null; justEvaluated = true;
    setDisplay(res.val, res.dim, expr + " =");
  } else if(entry){
    addHistory("Entered", fmtByPref(entry.val, entry.dim), entry.val, entry.dim);
    justEvaluated = true;
    setDisplay(entry.val, entry.dim, "Entered");
  }
  lastPct = null;
}
function currentOperand(){
  var e = commitEntry();
  if(e) return e;
  return {val:dispVal, dim:dispDim};
}

/* ---------- entry keys ---------- */
function pressDigit(d){

/* ---------- Conv conversions (reference: Ç + unit converts the value) ---------- */
function convertDisplayTo(u){
  var v;
  if(builderHasInput()){ v = commitEntry(); }
  else v = {val:dispVal, dim:dispDim};
  if(!v || v.dim === 0){ showMain("Conv", "Lengths only",""); return; }
  var key = u;
  if(v.dim === 1){
    if(u === "feet"){
      var target = (dispMode === "decft") ? "ftin" : "decft";
      dispMode = target;
      showMain("Conv · " + (target === "decft" ? "FEET" : "FEET–INCH"),
        target === "decft" ? fmtNum(v.val/12,4) + " ft" : fmtFI(v.val),"", v.val, 1);
      return;
    }
    if(u === "inch"){
      var t2 = (dispMode === "decin") ? "fracin" : "decin";
      dispMode = t2;
      showMain("Conv · " + (t2 === "decin" ? "INCHES" : "INCHES (FRAC)"),
        t2 === "decin" ? fmtNum(v.val,3) + " in" : fmtFracInch(v.val),"", v.val, 1);
      return;
    }
    var lbl = {yds:"YARDS", m:"METRES", cm:"CENTIMETRES", mm:"MILLIMETRES"}[u];
    var txt = {yds:fmtNum(v.val/36,4)+" yd", m:fmtNum(v.val*0.0254,4)+" m",
      cm:fmtNum(v.val*2.54,3)+" cm", mm:fmtNum(v.val*25.4,2)+" mm"}[u];
    dispMode = (u === "yds") ? "yd" : u;
    showMain("Conv · " + lbl, txt,"", v.val, 1);
    return;
  }
  /* area / volume conversions (reference p.15) */
  var per = {yds: v.dim===2 ? 1296 : 46656, feet: v.dim===2 ? 144 : 1728,
    inch: 1, m: v.dim===2 ? 929.0304 : 0.0000163871, cm: v.dim===2 ? 6.4516 : 16.3871,
    mm: v.dim===2 ? 645.16 : 16387.1};
  var unitName = {yds: v.dim===2 ? "SQ YD" : "CU YD", feet: v.dim===2 ? "SQ FT" : "CU FT",
    inch: v.dim===2 ? "SQ IN" : "CU IN", m: v.dim===2 ? "SQ M" : "CU M",
    cm: v.dim===2 ? "SQ CM" : "CU CM", mm: v.dim===2 ? "SQ MM" : "CU MM"}[u];
  var conv = (u === "m" || u === "cm" || u === "mm") ? v.val * per[u] : v.val / per[u];
  showMain("Conv · " + unitName, fmtNum(conv,6) + " " + unitName.toLowerCase().replace("sq ","").replace("cu ",""),"", v.val, v.dim);
  $("dispMain").textContent = fmtNum(conv,6) + " " + (v.dim===2 ? "sq " : "cu ") + ({yds:"yd",feet:"ft",inch:"in",m:"m",cm:"cm",mm:"mm"}[u]);
}

/* ---------- triangle: Rise / Run / Diag / Hip-V / Pitch (reference p.28-33) ---------- */
function pitchFromEntry(isRatio){
  var raw = bareNumber();
  var o = builderHasInput() ? builderValue() : null;
  if(isRatio && raw !== null) return {pitch: raw*12, form:"slp"};
  if(lastPct !== null && !builderHasInput()) return {pitch: lastPct/100*12, form:"grd"};
  if(o && o.dim === 1) return {pitch: o.val, form:"in"};                 /* 9 i p */
  if(raw !== null) return {pitch: Math.tan(raw*Math.PI/180)*12, form:"deg"};  /* 30 p = 30 deg */
  return null;
}

function pitchShow(form){
  var p = tri.pitch;
  if(p === null && tri.rise !== null && tri.run !== null) p = tri.rise/tri.run*12;
  if(p === null) return;
  tri.pitch = p;
  var ang = Math.atan2(p,12)*180/Math.PI;
  if(form === "in") showMain("Pitch", fmtFI(p),"", p, 0);
  else if(form === "deg") showMain("Pitch · Degrees", fmtAngle(ang),"", ang, 0);
  else if(form === "grd") showMain("Pitch · % Grade", fmtNum(p/12*100,5) + " %","", p/12*100, 0);
  else showMain("Pitch · Slope", fmtNum(p/12,6),"", p/12, 0);
}
function pitchKey(isRatio){
  if(builderHasInput() || lastPct !== null){
    var pe = pitchFromEntry(isRatio);
    if(!pe){ showMain("Pitch", "Pitch takes a number",""); return; }
    tri.pitch = pe.pitch;
    if(tri.run !== null) tri.rise = tri.run * pe.pitch / 12;
    pitchCycleIdx = PITCH_CYCLE.indexOf(pe.form);
    acc = null; pendingOp = null; justEvaluated = true; lastPct = null;
    clearBuilder();
    pitchShow(pe.form);
    return;
  }
  if(tri.rise === null || tri.run === null){
    if(tri.pitch !== null){
      pitchCycleIdx = (pitchCycleIdx+1) % 4;
      pitchShow(PITCH_CYCLE[pitchCycleIdx]);
    } else showMain("Pitch", "Store a Rise and a Run first","");
    return;
  }
  tri.pitch = tri.rise/tri.run*12;
  pitchCycleIdx = (pitchCycleIdx+1) % 4;   /* reference: p cycles in -> deg -> %grd -> slope */
  acc = null; pendingOp = null; justEvaluated = true;
  pitchShow(PITCH_CYCLE[pitchCycleIdx]);
}
function triJump(name){
  if(name === "rise" && tri.rise !== null) setDisplay(tri.rise, 1, "Rise");
  else if(name === "run" && tri.run !== null) setDisplay(tri.run, 1, "Run");
  else if(name === "diag" && tri.rise !== null && tri.run !== null){
    var dg = Math.sqrt(tri.rise*tri.rise + tri.run*tri.run);
    addHistory("Diagonal of " + fmtFI(tri.rise) + " × " + fmtFI(tri.run), fmtFI(dg), dg, 1);
    setDisplay(dg, 1, "Diagonal");
  }
  else if(name === "hip") hipKey();
}
function hipKey(){
  if(tri.rise === null || tri.run === null){ showMain("Hip/V", "Store a Rise and a Run first",""); return; }
  if(tri.irPitch !== null && tri.pitch !== null){
    var rise = tri.run * tri.pitch / 12;
    var runB = rise * 12 / tri.irPitch;
    var hp = Math.sqrt(tri.run*tri.run + runB*runB + rise*rise);
    addHistory("Irregular hip — " + fmtNum(tri.pitch,1) + "/12 × " + fmtNum(tri.irPitch,1) + "/12", fmtFI(hp), hp, 1);
    setDisplay(hp, 1, "Irregular Hip/V");
    return;
  }
  var hipRun = tri.run * Math.SQRT2;
  var hp2 = Math.sqrt(hipRun*hipRun + tri.rise*tri.rise);
  addHistory("Hip/valley — rise " + fmtFI(tri.rise) + " over run " + fmtFI(tri.run), fmtFI(hp2), hp2, 1);
  setDisplay(hp2, 1, "Hip / valley");
}
function irPitchKey(){
  if(builderHasInput()){
    var o = builderValue();
    if(o.dim !== 1){ showMain("Irregular Pitch", "Needs a length",""); return; }
    tri.irPitch = o.val;
    clearBuilder();

/* ---------- Stair (reference p.7, p.35-37): 12 results, press Stair to step ---------- */
function stairCompute(){
  var total = tri.rise;
  var wantR = riserStore !== null ? riserStore : 7.5;
  var wantT = treadStore !== null ? treadStore : 10;
  var risers = Math.max(1, Math.round(total / wantR));
  var actualR = total / risers;
  var treads = risers - 1;
  var run, treadW;
  if(tri.run !== null){ run = tri.run; treadW = run / treads; }
  else { treadW = wantT; run = treads * treadW; }
  var stringer = treads * Math.sqrt(Math.pow(roundRes(actualR, res()), 2) + Math.pow(roundRes(treadW, res()), 2));
  var angle = Math.atan2(total, run) * 180/Math.PI;
  var rOver = risers * roundRes(actualR, res()) - total;
  var tOver = run - treads * roundRes(treadW, res());
  return [
    {k:"Riser Height", v:fmtFI(actualR), val:actualR, dim:1},
    {k:"Risers", v:String(risers), val:risers, dim:0},
    {k:"Riser Overage", v:fmtFI(rOver), val:rOver, dim:1},
    {k:"Tread Width", v:fmtFI(treadW), val:treadW, dim:1},
    {k:"Treads", v:String(treads), val:treads, dim:0},
    {k:"Tread Overage", v:fmtFI(tOver), val:tOver, dim:1},
    {k:"Stringer Length", v:fmtFI(stringer), val:stringer, dim:1},
    {k:"Incline Angle", v:fmtAngle(angle), val:angle, dim:0},
    {k:"Stored Run", v:fmtFI(run), val:run, dim:1},
    {k:"Stored Rise", v:fmtFI(total), val:total, dim:1},
    {k:"Stored Riser Ht", v:fmtFI(wantR) + "  STORED", val:wantR, dim:1},
    {k:"Stored Tread W", v:fmtFI(wantT) + "  STORED", val:wantT, dim:1}
  ];
}
function stairKey(){
  if(tri.rise === null){ showMain("Stair", "Enter a Rise first",""); return; }
  var key = tri.rise + "|" + (tri.run||"") + "|" + (riserStore||7.5) + "|" + (treadStore||10);
  if(key !== stairSig){ stairSig = key; stairIdx = 0; }
  var items = stairCompute();
  var it = items[stairIdx % items.length];
  stairIdx++;
  addHistory("Stair · " + it.k, it.v, it.val, it.dim);
  setDisplay(it.val, it.dim, it.k);
  if(it.k === "Riser Height" || it.k === "Tread Width" || it.k === "Stringer Length" || it.k === "Stored Run" || it.k === "Stored Rise" || it.k === "Stored Riser Ht" || it.k === "Stored Tread W" || it.k === "Riser Overage" || it.k === "Tread Overage")
    $("dispMain").textContent = it.v;
  if(it.k === "Incline Angle") $("dispMain").textContent = it.v;
}

/* ---------- Jack (reference p.31-33): 1st press shows o.c., then JK1, JK2... ---------- */
function jackKey(){
  if(tri.rise === null || tri.run === null){ showMain("Jack", "Store Rise & Run first",""); return; }
  if(jackIdx === -1){
    showMain(jackIr ? "Irregular Jack · o.c." : "Jack · o.c.", fmtNum(ocStore,2) + " INCH  STORED","", ocStore, 1);
    jackIdx = 0; return;
  }
  var common = Math.sqrt(tri.rise*tri.rise + tri.run*tri.run);
  if(jackIr && tri.irPitch !== null && tri.pitch !== null){
    var rise = tri.run * tri.pitch / 12;
    var runB = rise * 12 / tri.irPitch;
    var cB = Math.sqrt(runB*runB + rise*rise);
    var diffB = ocStore * (cB / runB);
    var L = cB - diffB * (jackIdx+1);
    if(L <= 0){ showMain("Irregular Jack", "0′ 0″","", 0, 1); return; }
    jackIdx++;
    addHistory("Irregular Jack " + jackIdx, fmtFI(L), L, 1);
    setDisplay(L, 1, "Irregular Jack " + jackIdx);
    return;
  }
  var diff = ocStore * (common / tri.run);
  var Lj = common - diff * (jackIdx+1);
  if(Lj <= 0){ showMain("Jack", "0′ 0″","", 0, 1); return; }
  jackIdx++;
  addHistory("Jack " + jackIdx, fmtFI(Lj), Lj, 1);
  setDisplay(Lj, 1, "Jack " + jackIdx);
}
function irJackKey(){
  jackIr = true; jackIdx = -1;
  showMain("Irregular Jack · o.c.", fmtNum(ocStore,2) + " INCH  STORED","", ocStore, 1);
}

/* ---------- Rake-Wall (reference p.34): 1st press RWOC, then RW1, RW2..., BASE, angle ---------- */
function rwallKey(){
  if(tri.rise === null || tri.run === null){ showMain("R/Wall", "Enter Rise and Run first",""); return; }
  if(rwallIdx === -1){
    if(builderHasInput()){
      var o = builderValue();
      if(o.dim === 1) rwallBase = o.val;   /* reference: enter base height before ∑ */
      clearBuilder();
    }
    showMain("Rake-Wall · o.c.", fmtNum(ocStore,2) + " INCH  STORED","", ocStore, 1);
    rwallIdx = 0; return;
  }
  if(rwallIdx === 999){
    var ang = Math.atan2(tri.rise, tri.run) * 180/Math.PI;
    addHistory("Rake-Wall · Angle", fmtAngle(ang), ang, 0);
    showMain("Rake-Wall · Angle", fmtAngle(ang),"", ang, 0);
    rwallIdx = -1; return;
  }
  var i = rwallIdx + 1;
  var h = rwallBase + tri.rise * (1 - i*ocStore/tri.run);
  if(h > 0){
    rwallIdx++;
    addHistory("Rake-Wall Stud " + i, fmtFI(h), h, 1);
    setDisplay(h, 1, "Rake-Wall Stud " + i);
    return;
  }
  addHistory("Rake-Wall · Base", fmtFI(rwallBase), rwallBase, 1);
  showMain("Rake-Wall · Base", fmtFI(rwallBase),"", rwallBase, 1);
  rwallIdx = 999;
}

/* ---------- Weight / wt-vol (reference p.4, p.19-20, p.39) ---------- */
var WT_UNITS = ["Ton","LB","MET Ton","kG"];
function wtTons(volIn3, volUnit){
  var volYd = volIn3/46656, volFt = volIn3/1728, volM = volIn3*0.0000163871;
  switch(wtvol.unit){
    case 0: return volYd * wtvol.val;
    case 1: return volYd * wtvol.val / 2000;
    case 2: return volFt * wtvol.val / 2000;
    case 3: return volM * wtvol.val * 1.10231;
    case 4: return volM * wtvol.val / 907.185;
  }
  return volYd * wtvol.val;
}
function wtShow(lb, unitIdx){

function costQty(v, dim){

/* ---------- prompt sessions (extra solvers; one value at a time) ----------
   Press a solver key: it asks for each value on the display, one at a
   time. Type the value, press the same key (or =) to enter it. After the
   last one, the answer shows and stays. */
var session = null;
function P(id, label, unit, def){ return {id:id, label:label, unit:unit || "ftin", def:(def === undefined ? null : def)}; }
function setBuilderFromValue(val, unit){
  clearBuilder();
  if(unit === "ftin"){
    var sign = val < 0 ? "-" : ""; var a = Math.abs(val);
    var ft = Math.floor(a/12), rem = a - ft*12, inch = Math.floor(rem), six = Math.round((rem - inch)*16);
    if(six === 16){ inch += 1; six = 0; }
    if(inch === 12){ ft += 1; inch = 0; }
    fields.feet = ft ? sign + ft : ""; fields.inch = inch ? String(inch) : "";
    if(six){ fields.num = String(six); fields.den = "16"; }
    activeField = "feet";
  } else if(unit === "decft"){ bMode = "decft"; single = fmtNum(val/12, 4); }
  else if(unit === "decin"){ bMode = "decin"; single = fmtNum(val, 4); }
  else { bMode = "num"; single = fmtNum(val, 4); }
}
function showPrompt(){
  var pr = session.def.prompts[session.idx];
  clearBuilder();
  bMode = pr.unit;
  session.prefilled = false;
  var def = (typeof pr.def === "function") ? pr.def() : pr.def;
  session.curDef = def;
  if(def !== null && def !== undefined){
    setBuilderFromValue(def, pr.unit);
    session.prefilled = true;
    var dv = builderValue();
    setDisplay(dv.val, dv.dim, session.def.title + " · " + pr.label,
      "Shown: last / default — type to replace, " + session.def.keyLabel + " or = to enter · " + (session.idx+1) + " of " + session.def.prompts.length);
  } else {
    setDisplay(0, pr.unit === "num" ? 0 : 1, session.def.title + " · " + pr.label,
      "Type a value, then " + session.def.keyLabel + " or = · " + (session.idx+1) + " of " + session.def.prompts.length + " · Clear cancels");
  }
}
function startSession(name){
  var def = SESSIONS[name];
  if(!def) return;
  if(def.guard && !def.guard()) return;
  acc = null; pendingOp = null;
  session = {name:name, def:def, idx:0, values:{}, phase:"prompt", itemIdx:0, items:null, prefilled:false, curDef:null};
  showPrompt();
}
function acceptPrompt(){
  var pr = session.def.prompts[session.idx];
  var val;
  if(builderHasInput()){
    var bv = builderValue();
    val = bv.val;
  } else val = session.curDef;
  session.values[pr.id] = val;
  session.idx++;
  if(session.idx < session.def.prompts.length){ showPrompt(); }
  else finishSession();
}
function finishSession(){
  if(session.def.onFinish) session.def.onFinish(session.values);
  session.items = session.def.compute(session.values);
  session.phase = "results"; session.itemIdx = 0;
  bMode = "num"; clearBuilder();
  if(session.def.histFn){
    var t = session.def.histFn(session.values, session.items);
    if(t) addHistory(t[0], t[1], t[2], t[3]);
  }
  showItem();
}
function showItem(){
  var it = session.items[session.itemIdx]; if(!it) return;
  var n = session.items.length;
  var sub = "";
  if(n > 1) sub = (session.itemIdx + 1) + " of " + n;
  if(it.val !== undefined && it.val !== null) setDisplay(it.val, (it.dim === undefined ? 0 : it.dim), it.k, sub);
  else showMain(it.k, it.v, sub);
  if(it.val !== undefined && it.val !== null && it.v) $("dispMain").textContent = it.v;
}
function sessionAdvance(){
  if(session.phase === "prompt") acceptPrompt();
  /* v1.4 fix: results used to re-show item 0 forever (itemIdx was never
     incremented) while the display advertised "1 of N". Step through. */
  else { session.itemIdx = (session.itemIdx + 1) % session.items.length; showItem(); }
}
function sessionCancel(){
  session = null; bMode = "num"; clearBuilder();
}

var SESSIONS = {

    prompts:[ P("len","Rail length, post to post"), P("bw","Baluster width (in)","decin",1.5), P("gap","Max clear gap (in)","decin",4) ],

      var gap = (L - n*bw) / (n+1), oc = gap + bw, first = gap + bw/2;

      return items;
    },
    histFn:function(v){ return ["Board feet — " + fmtNum(v.t,1) + "×" + fmtNum(v.w,1) + "×" + fmtNum(v.l/12,1) + "ft × " + fmtInt(v.q), fmtNum(v.t*v.w*(v.l/12)/12*v.q,2) + " BF", v.t*v.w*(v.l/12)/12*v.q, 0]; }
  },
  conc: { title:"Concrete", keyLabel:"Bd Ft", key:"bdft",
    prompts:[ P("l","Length"), P("w","Width"), P("d","Thickness (in)","decin",4) ],
    compute:function(v){
      var cuft = (v.l/12)*(v.w/12)*(v.d/12), cuyd = cuft/27, cuydW = cuyd * (1 + prefWaste/100);
      return [
        {k:"Cubic yards net", v:fmtNum(cuyd,6) + " yd³", val:cuyd*46656, dim:3},
        {k:"Cubic yards w/ waste", v:fmtNum(cuydW,3) + " yd³", val:cuydW*46656, dim:3},
        {k:"Order (¼ yd round-up)", v:fmtNum(Math.ceil(cuydW*4)/4,2) + " yd³", val:Math.ceil(cuydW*4)/4*46656, dim:3},
        {k:"80 lb bags", v:fmtInt(Math.ceil(cuft*(1+prefWaste/100)/0.6)), val:Math.ceil(cuft*(1+prefWaste/100)/0.6), dim:0},
        {k:"60 lb bags", v:fmtInt(Math.ceil(cuft*(1+prefWaste/100)/0.45)), val:Math.ceil(cuft*(1+prefWaste/100)/0.45), dim:0},
        {k:"40 lb bags", v:fmtInt(Math.ceil(cuft*(1+prefWaste/100)/0.3)), val:Math.ceil(cuft*(1+prefWaste/100)/0.3), dim:0},
        {k:"Approx weight", v:fmtInt(cuft*150) + " lb", val:cuft*150, dim:0}
      ];
    },
    histFn:function(v, items){ return ["Concrete " + fmtFI(v.l) + " × " + fmtFI(v.w) + " × " + fmtNum(v.d,1) + "″", items[0].v, items[0].val, 3]; }
  },
  drywall: { title:"Drywall", keyLabel:"R/Wall", key:"rwall",
    prompts:[ P("l","Room length"), P("w","Room width"), P("h","Ceiling height") ],
    compute:function(v){
      var wallArea = 2*(v.l+v.w)*v.h/144, ceilArea = v.l*v.w/144, total = wallArea + ceilArea;
      var sheets = Math.ceil(total*(1+prefWaste/100)/32);
      return [
        {k:"Sheets 4×8 w/ waste", v:String(sheets), val:sheets, dim:0},
        {k:"Total area", v:fmtNum(total,1) + " ft²", val:total*144, dim:2},
        {k:"Wall area", v:fmtNum(wallArea,1) + " ft²", val:wallArea*144, dim:2},
        {k:"Ceiling area", v:fmtNum(ceilArea,1) + " ft²", val:ceilArea*144, dim:2},
        {k:"Joint compound", v:"≈ " + fmtNum(total/100*0.9,1) + " gal premix", val:total/100*0.9, dim:0},
        {k:"Screws", v:"≈ " + fmtInt(Math.ceil(total*1.4)), val:Math.ceil(total*1.4), dim:0}
      ];
    }
  },
  roof: { title:"Roofing", keyLabel:"Diag", key:"diag",
    prompts:[ P("l","Roof length (eave)"), P("s","Slope length, one side") ],
    compute:function(v){
      var areaOne = v.l * v.s / 144, total = areaOne * 2, totalW = total * (1 + prefWaste/100);
      var squares = totalW / 100;
      return [
        {k:"Bundles (3/square)", v:String(Math.ceil(squares*3)), val:Math.ceil(squares*3), dim:0},
        {k:"Squares", v:fmtNum(squares,2), val:squares, dim:0},
        {k:"Area w/ waste", v:fmtNum(totalW,1) + " ft²", val:totalW*144, dim:2},
        {k:"Total area", v:fmtNum(total,1) + " ft² (both sides)", val:total*144, dim:2},
        {k:"Underlayment", v:String(Math.ceil(totalW/400)) + " rolls (400 ft²)", val:Math.ceil(totalW/400), dim:0}
      ];
    }
  },
};

/* ---------- stored settings: riser / tread / o.c. (reference: value + Conv+key) ---------- */
function storeSetting(which){
  var o = builderHasInput() ? currentOperand() : {val:dispVal, dim:dispDim};
  if(o.dim !== 1){ showMain(which === "riser" ? "Riser Ht" : which === "tread" ? "Tread W" : "On-Centre", "Needs a length",""); return; }
  if(which === "riser"){ riserStore = o.val; showMain("Riser Ht", fmtFI(o.val) + "  STORED","", o.val, 1); }
  else if(which === "tread"){ treadStore = o.val; showMain("Tread W", fmtFI(o.val) + "  STORED","", o.val, 1); }
  else { ocStore = o.val; jackIdx = -1; rwallIdx = -1; showMain("On-Centre", fmtNum(o.val,2) + " INCH  STORED","", o.val, 1); }
}
function recallStored(which){
  if(which === "oc") showMain("On-Centre", fmtNum(ocStore,2) + " INCH","", ocStore, 1);
  else if(which === "riser") showMain("Riser Ht", fmtFI(riserStore !== null ? riserStore : 7.5) + "  STORED","", riserStore !== null ? riserStore : 7.5, 1);
  else if(which === "tread") showMain("Tread W", fmtFI(treadStore !== null ? treadStore : 10) + "  STORED","", treadStore !== null ? treadStore : 10, 1);
}

/* ---------- Shift (Conv) functions ---------- */
var SHIFT = { hip:"irpitch", circ:"arc", jack:"irjack", sqrt:"sq", "d:7":"riserht", "d:9":"treadw",
  "op:/":"recip", rcl:"mrc", "d:5":"oc", "op:*":"clearall", mplus:"mminus", "op:-":"sign",
  pct:"prefs", "d:0":"wtvol", dot:"cost", "op:+":"pi",
  bdft:"conc", stair:"bal", rwall:"drywall", diag:"roof" };
function handleShift(action){
  if(session && session.phase === "prompt" && action !== "clearall") return;
  if(session && session.phase === "results") sessionCancel();
  switch(action){
    case "irpitch": irPitchKey(); break;
    case "arc": arcKey(); break;
    case "irjack": irJackKey(); break;
    case "conc": startSession("conc"); break;
    case "bal": startSession("bal"); break;
    case "drywall": startSession("drywall"); break;
    case "roof": startSession("roof"); break;
    case "wtconv": weightKey(); break;
    case "wtvol": wtvolStore(); break;
    case "oc": storeSetting("oc"); break;
    case "cost": costKey(); break;
    case "prefs": prefsEnter(); break;
    case "sq": case "recip": case "sign": case "pi": primaryKey(action); break;
    case "riserht": storeSetting("riser"); break;
    case "treadw": storeSetting("tread"); break;
    case "mrc": memClear(); break;
    case "mminus": memAdd(-1); break;
    case "clearall":
      sessionCancel(); prefsMode = false; costPrompt = null;
      acc = null; pendingOp = null; clearBuilder(); justEvaluated = false; tempRes = null;
      tri = {rise:null, run:null, pitch:null, irPitch:null};
      riserStore = null; treadStore = null; ocStore = 16;
      wtvol = {val:1.5, unit:0}; memory = null; memRecallMode = false;
      stairIdx = 0; jackIdx = -1; rwallIdx = -1; circDia = null; weightState = null;
      setDisplay(0, 1, "Clear All"); break;
  }
}
/* ---------- primary keys ---------- */
var ENTRY_KEYS = {"dot":1,"back":1,"feet":1,"inch":1,"frac":1,"yds":1,"m":1,"cm":1,"mm":1};
function isEntryKey(k){ return k.indexOf("d:") === 0 || !!ENTRY_KEYS[k]; }

function primaryKey(k){
  if(k.indexOf("d:") === 0) return pressDigit(k.slice(2));
  if(k === "dot"){
    if(bMode === "num"){ if(single.indexOf(".") < 0) pressDigit("."); }
    else if(bMode === "ftin"){
      if(activeField === "feet" || activeField === "inch"){ if(fields[activeField].indexOf(".") < 0) pressDigit("."); }
    } else if(single.indexOf(".") < 0) pressDigit(".");
    return;
  }
  switch(k){
    case "back": pressBack(); break;
    case "feet": pressFeetKey(); break;
    case "inch": pressInchKey(); break;
    case "frac": pressFracKey(); break;
    case "yds": pressUnitKey("yd"); break;
    case "m": pressUnitKey("m"); break;
    case "cm": pressUnitKey("cm"); break;
    case "mm": pressUnitKey("mm"); break;
    case "op:+": pressOp("+"); break;
    case "op:-": pressOp("-"); break;
    case "op:*": pressOp("*"); break;
    case "op:/": pressOp("/"); break;
    case "eq": pressEquals(); break;
    case "bdft": {
      /* reference flow: 2 x 4 x 16 Bd Ft -> board feet of the pending product */
      if(acc !== null && pendingOp === "*"){
        var e = builderHasInput() ? commitEntry() : {val:dispVal, dim:0};
        var prod = acc.val * e.val;
        var bf = prod / 12;
        addHistory("Board feet — " + fmtNum(acc.val,2) + " × " + fmtNum(e.val,2) + " / 12", fmtNum(bf,5) + " BF", bf, 0);
        acc = null; pendingOp = null; justEvaluated = true; costPerMbm = true;
        showMain("Board Feet", fmtNum(bf,5) + " BF","", bf, 0);
        break;
      }
      startSession("bdft"); break; }
    case "stair": stairKey(); break;
    case "circ": circKey(); break;
    case "rwall": rwallKey(); break;
    case "jack": jackKey(); break;
    case "weight": weightKey(); break;
    case "pitch": pitchKey(false); break;
    case "pct": {
      var raw = builderHasInput() ? bareNumber() : null;
      var e = currentOperand();
      if(raw !== null) e = {val:raw, dim:0};
      if(acc && pendingOp){
        var res;
        if(pendingOp === "+" || pendingOp === "-"){
          var pv = {val: acc.val * e.val/100, dim: acc.dim};
          res = applyOp(acc, pendingOp, pv);
        } else if(pendingOp === "*"){
          res = {val: acc.val * e.val/100, dim: acc.dim};
        } else {
          res = {val: e.val === 0 ? NaN : acc.val / (e.val/100), dim: acc.dim};
        }
        var expr = fmtByPref(acc.val, acc.dim) + " " + opSymbol(pendingOp) + " " + fmtNum(e.val,2) + "%";
        addHistory(expr, fmtByPref(res.val, res.dim), res.val, res.dim);
        acc = null; pendingOp = null; justEvaluated = true;
        lastPct = e.val;
        setDisplay(res.val, res.dim, expr + " =");
      } else {
        lastPct = e.val;
        var pv2 = {val: e.val/100, dim: 0};
        setDisplay(pv2.val, pv2.dim, fmtNum(e.val,2) + "% =");
      }
      break; }
    case "sqrt": { var o = currentOperand(); var v = Math.sqrt(Math.abs(o.val));
      var d3 = o.dim === 2 ? 1 : (o.dim === 0 ? 0 : 1);
      addHistory("√ " + fmtByPref(o.val, o.dim), fmtByPref(v, d3), v, d3);
      setDisplay(v, d3, "√ " + fmtByPref(o.val, o.dim) + " ="); justEvaluated = true; break; }
    case "sq": { var o2 = currentOperand(); var v2 = o2.val * o2.val;
      var d4 = o2.dim === 0 ? 0 : (o2.dim === 1 ? 2 : o2.dim);
      addHistory(fmtByPref(o2.val, o2.dim) + " ²", fmtByPref(v2, d4), v2, d4);
      setDisplay(v2, d4, fmtByPref(o2.val, o2.dim) + " squared ="); justEvaluated = true; break; }
    case "recip": { var o3 = currentOperand(); var v3 = o3.val === 0 ? NaN : 1/o3.val;
      setDisplay(v3, 0, "1 ÷ " + fmtByPref(o3.val, o3.dim) + " ="); justEvaluated = true; break; }
    case "sign": {
      if(builderHasInput()){
        if(bMode === "ftin"){ fields.feet = fields.feet.indexOf("-") === 0 ? fields.feet.slice(1) : "-" + (fields.feet || "0"); }
        else single = single.indexOf("-") === 0 ? single.slice(1) : "-" + single;
        liveEntryPreview();
      } else setDisplay(-dispVal, dispDim, "Negated");
      break; }
    case "pi": setDisplay(Math.PI, 0, "π"); justEvaluated = true; break;
    case "rcl": rclArmed = true; updateIndicators(); break;
    case "mplus": memAdd(1); break;
    case "rise": case "run": {
      if(builderHasInput()){
        var o6 = currentOperand(); if(o6.dim !== 1){ setDisplay(dispVal, dispDim, "Rise/Run need a length"); break; }
        tri[k] = o6.val;
        if(k === "rise") tri.pitch = null;
        if(k === "run" && tri.rise === null && tri.pitch !== null) tri.rise = o6.val * tri.pitch / 12;
        acc = null; pendingOp = null; justEvaluated = true;
        triJump(k);
      } else {
        var storedLeg = tri[k];
        if(storedLeg === null){ setDisplay(dispVal, dispDim, "No " + k + " stored"); break; }
        acc = null; pendingOp = null; clearBuilder(); justEvaluated = true;
        triJump(k);
      }
      break; }
    case "diag": {
      if(tri.rise === null || tri.run === null){ setDisplay(dispVal, dispDim, "Diag"); break; }
      acc = null; pendingOp = null; clearBuilder(); justEvaluated = true;
      triJump("diag"); break; }
    case "hip": {
      if(tri.rise === null || tri.run === null){ setDisplay(dispVal, dispDim, "Hip/V"); break; }
      acc = null; pendingOp = null; clearBuilder(); justEvaluated = true;
      hipKey(); break; }
  }
}

/* ---------- routing: Clear, Conv/Shift, Rcl, sessions, prefs ---------- */

/* ---------- Conv label swap (v1.4) ----------
   No small-print second-function labels on the face. Each key that has
   a second function carries a dot (CSS .has-shift::after) and, while
   Conv is armed, its visible label swaps to the second function.
   Display-only: which function a press calls is unchanged (see
   handleKey / SHIFT / TEMP_RES). Keys with no entry here have no
   second function and keep their label (unit keys convert on Conv,
   Weight's Conv action is the same entry point as its primary). */
var SHIFT_LABELS = { pitch:"Ratio", diag:"Roof", hip:"Ir/Pitch",
  bdft:"Conc", stair:"Bal", circ:"Arc", rwall:"Drywall", jack:"Ir/Jack",
  sqrt:"x\u00b2", "d:7":"Riser Ht", "d:9":"Tread W", "op:/":"1/x",
  rcl:"M-R/C", "d:5":"o.c.", "op:*":"Clear All", mplus:"M\u2212",
  "op:-":"+\u2212 \u25b2", pct:"Prefs", "d:0":"wt/vol", dot:"Cost",
  "op:+":"\u03c0 \u25bc",
  "d:1":"1/16", "d:2":"1/2", "d:3":"1/32", "d:4":"1/4", "d:6":"1/64", "d:8":"1/8" };
function initShiftLabels(){
  document.querySelectorAll("button.key").forEach(function(b){
    var alt = SHIFT_LABELS[b.getAttribute("data-k")];
    if(!alt) return;
    b.dataset.primary = b.textContent;
    b.dataset.alt = alt;
    b.classList.add("has-shift");
  });
}
function applyShiftLabels(on){
  document.querySelectorAll("button.key.has-shift").forEach(function(b){
    b.textContent = on ? b.dataset.alt : b.dataset.primary;
  });
}
function setShift(on){
  shiftArmed = on;
  document.querySelectorAll("button.key.conv").forEach(function(b){ b.classList.toggle("armed", on); });
  applyShiftLabels(on);
  updateIndicators();
}
function clearTransientModes(){
  oncCount = 0;
  if(memRecallMode){ memRecallMode = false; memCycle = 0; }
}
function handleOnC(){
  if(historyOpen){ closeHistory(); return; }
  if(prefsMode){ prefsMode = false; setDisplay(dispVal, dispDim, "Ready"); return; }
  if(session){ sessionCancel(); setDisplay(0, 1, "Ready"); return; }
  if(costPrompt){ costPrompt = null; clearBuilder(); setDisplay(dispVal, dispDim, "Ready"); return; }
  if(rclArmed){ rclArmed = false; updateIndicators(); return; }
  if(shiftArmed){ setShift(false); return; }
  oncCount++;
  if(oncCount === 1){
    /* reference: 1st press clears the display (entry + pending op) */
    acc = null; pendingOp = null; clearBuilder(); justEvaluated = false; lastPct = null;
    setDisplay(0, 1, "Ready");
  } else {
    /* reference: 2nd press clears all temporary values (not Pitch, not Prefs) */
    oncCount = 0;
    acc = null; pendingOp = null; clearBuilder(); justEvaluated = false; tempRes = null;
    tri.rise = null; tri.run = null; tri.irPitch = null;
    stairIdx = 0; jackIdx = -1; rwallIdx = -1; circDia = null; weightState = null;
    setDisplay(0, 1, "Cleared");
  }
}
function handleKey(k){
  if(k !== "onc") { /* Clear counting is handled in handleOnC */ }
  if(k === "onc"){ handleOnC(); return; }
  if(k !== "conv") oncCount = 0;
  if(prefsMode){
    if(k === "pct"){ prefsIdx = (prefsIdx+1) % PREFS.length; prefsShow(); return; }
    if(k === "op:+"){ prefsStep(1); return; }
    if(k === "op:-"){ prefsStep(-1); return; }
    if(k === "conv"){ setShift(!shiftArmed); return; }
    return;   /* other keys ignored in Prefs */
  }
  if(historyOpen){ return; }  /* keypad is hidden while History is open */
  if(costPrompt){
    if(isEntryKey(k)){ primaryKey(k); return; }
    if(k === "eq" || (shiftArmed && k === "dot")){ setShift(false); costFinish(); return; }
    if(k === "conv"){ setShift(!shiftArmed); return; }
    costPrompt = null;
  }
  if(rclArmed){
    rclArmed = false;
    if(k === "mplus"){ memRecall(); return; }
    if(k === "rcl"){ memRecallClear(); return; }
    if(k === "d:0"){ wtvolRecall(); return; }
    if(k === "d:5"){ recallStored("oc"); return; }
    if(k === "d:7"){ recallStored("riser"); return; }
    if(k === "d:9"){ recallStored("tread"); return; }
    if(k === "stair"){ recallStored("riser"); return; }
    updateIndicators();
    /* any other key: Rcl was a no-op, process the key normally */
  }
  if(k === "conv"){ setShift(!shiftArmed); return; }
  if(shiftArmed){
    setShift(false);
    if(k === "pitch"){ pitchKey(true); return; }   /* Conv+p = pitch ratio */
    if(k === "weight"){ weightKey(); return; }     /* reference: Ç w converts volume to weight */
    if(k.indexOf("d:") === 0 && TEMP_RES[k.slice(2)] !== undefined){ tempResKey(k.slice(2)); return; }
    var action = SHIFT[k];
    if(action){ handleShift(action); return; }
    if(k === "feet" || k === "inch" || k === "yds" || k === "m" || k === "cm" || k === "mm"){ convertDisplayTo(k); return; }
    /* no shift function: fall through to the primary key */
  }
  if(k !== "mplus" && k !== "op:+" && k !== "op:-") clearTransientModes();
  if(session){
    if(session.phase === "prompt"){
      if(k === session.def.key || k === "eq"){ sessionAdvance(); return; }
      if(isEntryKey(k) || k.indexOf("d:") === 0){ primaryKey(k); return; }
      return;
    }
    if(k === session.def.key || k === "eq"){ sessionAdvance(); return; }
    sessionCancel();
  }
  if(wtvolStoreMode && k !== "d:0") wtvolStoreMode = false;
  primaryKey(k);
}
document.querySelectorAll("button.key").forEach(function(b){
  b.addEventListener("click", function(){ handleKey(b.getAttribute("data-k")); });
});
$("histBtn").addEventListener("click", function(){ toggleHistory(); });
$("histBack").addEventListener("click", function(){ closeHistory(); });
$("histPrev").addEventListener("click", function(){ histPageStep(-1); });
$("histNext").addEventListener("click", function(){ histPageStep(1); });
document.addEventListener("keydown", function(ev){
  if(/^[0-9]$/.test(ev.key)) handleKey("d:" + ev.key);
  else if(ev.key === ".") handleKey("dot");
  else if(ev.key === "+") handleKey("op:+");
  else if(ev.key === "-") handleKey("op:-");
  else if(ev.key === "*") handleKey("op:*");
  else if(ev.key === "/"){ ev.preventDefault(); if(builderHasInput() && bMode === "ftin" && activeField === "num") handleKey("frac"); else handleKey("op:/"); }
  else if(ev.key === "Enter" || ev.key === "="){ ev.preventDefault(); handleKey("eq"); }
  else if(ev.key === "Backspace") handleKey("back");
  else if(ev.key === "Escape") handleKey("onc");
  else if(ev.key.toLowerCase() === "f") handleKey("feet");
  else if(ev.key.toLowerCase() === "i") handleKey("inch");
});

initShiftLabels();
setDisplay(0, 1, "Ready");
</script>
</body>
</html>
